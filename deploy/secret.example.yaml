# Copy to secret.yaml, fill in, apply; never commit the filled file.
# The CronJob's own Secret (geoecon-secrets) is mounted separately and is not duplicated here.
apiVersion: v1
kind: Secret
metadata:
  name: geoecon-mcp-auth
  namespace: hussein-ns
type: Opaque
stringData:
  # OAuth 2.1 resource-server settings. Both AUTH_ISSUER and AUTH_RESOURCE_URL must be set for
  # the HTTP layer to require bearer tokens; the resource URL is the public URL (token `aud`).
  AUTH_ISSUER: "https://login.example.org/realms/geoecon"
  AUTH_RESOURCE_URL: "https://geoecon-mcp.example.org/mcp"
  AUTH_JWKS_URL: "https://login.example.org/realms/geoecon/protocol/openid-connect/certs"
  # Alternatives to AUTH_JWKS_URL (set exactly one key source):
  # AUTH_PUBLIC_KEY_PEM: |
  #   -----BEGIN PUBLIC KEY-----
  #   ...
  #   -----END PUBLIC KEY-----
  # AUTH_HS256_SECRET: "at-least-32-bytes-of-random-for-dev-only"
  # Sending from this server stays off unless an operator decides otherwise AND holds pipeline:send.
  ALLOW_SEND: "0"
