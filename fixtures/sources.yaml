# =============================================================================
# geoecon source registry  —  sources.yaml
# =============================================================================
# A flat, full-metadata source registry that drives multi-strategy discovery.
# This file is DATA, not code: edit it to add/retire/fix sources without touching
# the pipeline. The fetcher dispatches on `fetch_type`; the corroboration layer
# reads `tier`, `origin_class`, `ownership`, `state_alignment`; synthesis reads
# `lang`.
#
# -----------------------------------------------------------------------------
# AUTHORITY OF THIS FILE  (read before trusting any field)
# -----------------------------------------------------------------------------
# This registry was built in two layers with DIFFERENT confidence:
#
#   LIBRARIAN layer (high confidence, stable, human-verified):
#     id, country, country_fips, bucket, institution, tier, origin_class,
#     ownership, state_alignment, lang, reliability, notes
#   These describe the INSTITUTION'S IDENTITY and do not rot on site redesigns.
#
#   MECHANICS layer (UNVERIFIED — must be resolved in-environment):
#     fetch_type, feed_url, extract_hint
#   Government economic sites in these regions mostly do NOT publish RSS; they
#   are JS-rendered ASP.NET/SharePoint or custom portals that require scraping,
#   and the wires have degraded their public RSS. Feed existence and selectors
#   CANNOT be reliably verified outside the run environment, so every entry ships
#   with `fetch_type: unverified` and candidate paths in `probe_paths`.
#   ==> Claude Code resolves these in "Task 0" (see the change prompt) and writes
#       the results back into this file. Until then, treat mechanics as TODO.
#
# -----------------------------------------------------------------------------
# FIELD REFERENCE
# -----------------------------------------------------------------------------
#   id              stable snake_case key  (never reused / renamed)
#   country         ISO 3166-1 alpha-2  (registry-side, human-readable)
#   country_fips    FIPS 10-4  (what the PIPELINE buckets on — see file 01)
#   bucket          middle_east | north_africa | latam   (active buckets)
#   institution     display name
#   tier            0 primary/authoritative  (the truth anchor — IS the event)
#                   1 wire                   (the recall floor)
#                   2 regional/national      (coverage + texture; bias-flagged)
#                   3 firehose               (tripwire; GDELT — not listed here)
#   origin_class    one or more of:
#                     monetary fiscal trade energy investment sanctions macro
#                   (spans the institutional ORIGIN of each geoeconomic topic so
#                    "all topics equal" is structural, not aspirational)
#   fetch_type      unverified | rss | api | scrape | dead   (mechanics layer)
#   url             canonical human URL of the news/press section
#   feed_url        resolved feed/API endpoint (null until Task 0)
#   probe_paths     candidate feed paths for Task 0 to try, in priority order
#   extract_hint    CSS selector for scrape targets (null until Task 0)
#   lang            PRIMARY publish language (native-first policy)
#                     ar Arabic · es Spanish · pt Portuguese · fr French
#                     tr Turkish · fa Farsi · he Hebrew · en English
#   ownership       state | state_linked | private | multilateral | foreign_gov
#   state_alignment ISO of the state whose framing this source carries, or null.
#                   Drives the corroboration layer's independence weighting:
#                   two sources sharing a state_alignment are NOT independent.
#   reliability     high | degraded | intermittent | absent
#                     degraded   = publishes but thin / slow / partial
#                     intermittent = sanctions/instability; flickers
#                     absent     = no usable official channel; covered by wire+actor
#   notes           caveats, language quirks, split-institution facts, ToS flags
#   verified        ISO date the LIBRARIAN layer was checked
#   status          live | needs_review | dead
#
# -----------------------------------------------------------------------------
# POLICY DECISIONS BAKED IN (agreed during design)
# -----------------------------------------------------------------------------
#  * native-language-first: prefer the native feed; English mirror is fallback.
#    Synthesis (DeepSeek V3.2) translates foreign->English downstream, so pulling
#    the native primary is strictly better (earlier, fuller, truer).
#  * SOCIAL sources EXCLUDED (ToS + fragility), even where they are an
#    institution's fastest channel. Accepted coverage gap for the hard countries
#    is carried by the wire + external-actor tiers.
#  * WEAK-LANGUAGE EXCEPTION: for Iran (fa) and to a lesser extent Turkey (tr),
#    where the model's translation competence thins, entries are deliberately
#    paired with a strong-language (en/ar) corroborator so each event has a
#    cross-checkable witness. Flagged per-entry in notes.
#  * Tier-0 primaries are trusted by construction and may BYPASS the discovery
#    theme/bucket gates (they are curated recall instruments); precision is left
#    to the LLM gate. (Implemented in Change 5, not Change 1.)
# =============================================================================

meta:
  schema_version: 1
  generated: "2026-06-22"
  librarian_verified: "2026-06-22"
  mechanics_status: "RESOLVED via Task 0 on 2026-06-23 (live prober, robots-respecting):
    11 rss, 34 scrape, 3 sitemap. See sources.resolved.report.md."
  buckets: [middle_east, north_africa, latam]
