[project]
name = "geoecon-pipeline-mcp"
version = "0.1.0"
description = "MCP server that operates the geoeconomic news pipeline: durable job handles for stage runs, progress, subscriptions/listen, an LLM cost gate, incident-report prompts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.2.0",
    "pydantic>=2.7",
    "psycopg[binary]>=3.1",
    "PyJWT[crypto]>=2.8",
    "pyyaml>=6.0",
    "geoecon @ git+https://github.com/jalalhussein1982/geoeconomics-news-fetcher@c6ae09b6209b2472a4e209856b413fafddcb1a79",
]

[project.scripts]
geoecon-pipeline-mcp = "geoecon_pipeline_mcp.server:main"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pytest>=9.1.1",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs an ephemeral PostgreSQL (initdb/pg_ctl on PATH); skipped otherwise"]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["geoecon_pipeline_mcp"]

[tool.hatch.metadata]
allow-direct-references = true
